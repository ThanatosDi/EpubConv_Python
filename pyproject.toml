[project]
name = "epubconv-python"
version = "3.0.0"
description = "Use python convert epub file from Simplified Chinese to Traditional Chinese on windows"
authors = [{ name = "ThanatosDi", email = "yykkold55tw@gmail.com" }]
requires-python = ">=3.10,<3.13"
readme = "README.md"
license = "Apache-2.0"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "aiohttp>=3.13.4,<4",
    "cssutils>=2.6.0,<3",
    "requests>=2.32.4,<3",
    "python-dotenv>=0.21.0,<0.22",
    "bs4>=0.0.1,<0.0.2",
    "lxml>=4.9.1,<7.0.0",
    "loguru>=0.7.2,<0.8",
    "opencc>=1.2.0,<2",
    "chardet>=5.2.0,<6",
]

[dependency-groups]
dev = [
    "pytest>=7.2.0,<8",
    "autopep8>=2.0.1,<3",
    "pytest-asyncio>=0.21.0,<0.22",
    "pyinstaller>=6.6.0,<7",
    "poethepoet>=0.27.0,<0.28",
    "pytest-mock>=3.14.0,<4",
]

[tool.uv]
package = false
default-groups = "all"

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.poe.tasks]
build = "pyinstaller ./main.spec --clean"
