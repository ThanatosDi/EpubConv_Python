[project]
name = "epubconv-python"
version = "3.1.0"
description = "Use python convert epub file from Simplified Chinese to Traditional Chinese on windows"
authors = [{ name = "ThanatosDi", email = "yykkold55tw@gmail.com" }]
requires-python = ">=3.10,<3.15"
readme = "README.md"
license = "Apache-2.0"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "aiohttp>=3.14.5,<4",
    "cssutils>=2.15.0,<3",
    "requests>=2.34.2,<3",
    "python-dotenv>=1.2.4,<2",
    "bs4>=0.0.2,<0.0.3",
    "lxml>=4.9.1,<7.0.0",
    "loguru>=0.7.3,<0.8",
    "opencc>=1.4.2,<2",
    "chardet>=7.6.0,<8",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1,<10",
    "autopep8>=2.3.2,<3",
    "pytest-asyncio>=1.4.0,<2",
    "pyinstaller>=6.16.0,<7",
    "poethepoet>=0.48.0,<0.49",
    "pytest-mock>=3.16.0,<4",
]

[tool.uv]
package = false
default-groups = "all"

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.poe.tasks]
build = "pyinstaller ./main.spec --clean"
